<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atividades</title>
<link rel="stylesheet" href="assets/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-config.js"></script>
<script>guardDashboardAuth();</script>
<style>
  .filter-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:18px;}
  .filter-row input[type=text]{width:auto;min-width:200px;flex:1;}
  .filter-row select{width:auto;min-width:160px;}
  .action-cell{display:flex;gap:6px;flex-wrap:wrap;}
  .action-cell .btn{padding:6px 10px;font-size:11.5px;}
</style>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="page">

      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-label">Pendentes</div><div class="kpi-value" id="kpiPendentes">0</div></div>
        <div class="kpi-card"><div class="kpi-label">Em andamento</div><div class="kpi-value" id="kpiAndamento">0</div></div>
        <div class="kpi-card"><div class="kpi-label">Urgentes</div><div class="kpi-value" id="kpiUrgentes">0</div></div>
        <div class="kpi-card"><div class="kpi-label">Total</div><div class="kpi-value" id="kpiTotal">0</div></div>
      </div>

      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div class="card-title" style="margin:0;flex:1;">Nova atividade</div>
          <button class="btn btn-outline" id="toggleFormBtn" style="padding:6px 12px;font-size:12px;">+ Nova atividade</button>
        </div>
        <div id="formBody" style="display:none;margin-top:16px;">
          <label class="f-label">Título</label>
          <input type="text" id="fTitulo" placeholder="Ex: Ligar para cliente X">
          <label class="f-label">Descrição (opcional)</label>
          <textarea id="fDescricao" placeholder="Detalhe da tarefa" style="min-height:60px;"></textarea>
          <div class="two-col">
            <div>
              <label class="f-label">Responsável</label>
              <input type="text" id="fResponsavel" list="equipeNames" placeholder="Quem vai fazer">
            </div>
            <div>
              <label class="f-label">Criado por</label>
              <input type="text" id="fCriadoPor" list="equipeNames" placeholder="Quem está criando">
            </div>
          </div>
          <div class="two-col">
            <div>
              <label class="f-label">Prazo (opcional)</label>
              <input type="date" id="fPrazo">
            </div>
            <div>
              <label class="f-label">Prioridade</label>
              <select id="fPrioridade">
                <option>Baixa</option>
                <option selected>Normal</option>
                <option>Alta</option>
                <option>Urgente</option>
              </select>
            </div>
          </div>
          <div class="form-actions" style="margin-top:14px;">
            <button class="btn btn-dark" id="saveBtn">Salvar atividade</button>
            <button class="btn btn-outline" id="cancelFormBtn">Cancelar</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="filter-row">
          <input type="text" id="searchInput" placeholder="Buscar por título ou descrição...">
          <select id="statusFilter">
            <option value="">Todos os status</option>
            <option>Pendente</option>
            <option>Em andamento</option>
            <option>Concluído</option>
            <option>Cancelado</option>
          </select>
          <select id="prioridadeFilter">
            <option value="">Todas as prioridades</option>
            <option>Baixa</option>
            <option>Normal</option>
            <option>Alta</option>
            <option>Urgente</option>
          </select>
          <input type="text" id="responsavelFilter" placeholder="Filtrar por responsável" style="max-width:200px;">
        </div>

        <div style="overflow-x:auto;">
          <table class="data-table">
            <thead><tr>
              <th>Título</th><th>Responsável</th><th>Criado por</th><th>Criada em</th>
              <th>Prazo</th><th>Prioridade</th><th>Status</th><th>Ações</th>
            </tr></thead>
            <tbody id="listBody"></tbody>
          </table>
        </div>
        <div id="emptyState" class="empty-state" style="display:none;">Nenhuma atividade encontrada.</div>
      </div>

    </div>
  </div>
</div>

<datalist id="equipeNames"></datalist>
<div class="toast" id="toast"></div>

<script src="assets/shared.js"></script>
<script src="assets/modules.js"></script>
<script src="assets/shell.js"></script>
<script>
renderShell({ active: 'atividades', title: 'Atividades', subtitle: 'Tarefas internas da equipe' });

const DOC_KEY = 'atividades-db';
const toast = document.getElementById('toast');
function showToast(msg){ toast.textContent = msg; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'), 2200); }

let items = [];
let editingId = null;

async function load(){ items = await loadDoc(DOC_KEY, []); if(!Array.isArray(items)) items = []; }
async function save(){ await saveDoc(DOC_KEY, items); }

function statusTagClass(status){
  switch(status){
    case 'Concluído': return 'tag-success';
    case 'Cancelado': return 'tag-cancel';
    case 'Em andamento': return 'tag-progress';
    default: return 'tag-pending';
  }
}
function prioridadeTagClass(p){
  switch(p){
    case 'Urgente': return 'tag-cancel';
    case 'Alta': return 'tag-info';
    case 'Baixa': return 'tag-neutral';
    default: return 'tag-pending';
  }
}

const formBody = document.getElementById('formBody');
const toggleFormBtn = document.getElementById('toggleFormBtn');
function openForm(item){
  editingId = item ? item.id : null;
  document.getElementById('fTitulo').value = item ? item.titulo : '';
  document.getElementById('fDescricao').value = item ? (item.descricao || '') : '';
  document.getElementById('fResponsavel').value = item ? item.responsavel : '';
  document.getElementById('fCriadoPor').value = item ? item.criadoPor : '';
  document.getElementById('fPrazo').value = item ? (item.prazo || '') : '';
  document.getElementById('fPrioridade').value = item ? item.prioridade : 'Normal';
  formBody.style.display = 'block';
  toggleFormBtn.textContent = 'Ocultar';
  document.getElementById('saveBtn').textContent = item ? 'Salvar alterações' : 'Salvar atividade';
}
function closeForm(){
  editingId = null;
  formBody.style.display = 'none';
  toggleFormBtn.textContent = '+ Nova atividade';
}
toggleFormBtn.addEventListener('click', () => {
  if(formBody.style.display === 'none') openForm(null);
  else closeForm();
});
document.getElementById('cancelFormBtn').addEventListener('click', closeForm);

document.getElementById('saveBtn').addEventListener('click', async () => {
  const titulo = document.getElementById('fTitulo').value.trim();
  if(!titulo){ showToast('Preencha o título da atividade'); return; }
  const data = {
    titulo, descricao: document.getElementById('fDescricao').value.trim(),
    responsavel: document.getElementById('fResponsavel').value.trim(),
    criadoPor: document.getElementById('fCriadoPor').value.trim(),
    prazo: document.getElementById('fPrazo').value || null,
    prioridade: document.getElementById('fPrioridade').value
  };
  if(editingId){
    const item = items.find(i => i.id === editingId);
    Object.assign(item, data);
    item.updatedAt = Date.now();
  } else {
    items.unshift(Object.assign({ id: genId(), status: 'Pendente', dataCriacao: dateSuffix(), createdAt: Date.now(), updatedAt: Date.now() }, data));
  }
  await save();
  closeForm();
  render();
  showToast('Atividade salva');
});

async function setStatus(id, status){
  const item = items.find(i => i.id === id);
  if(!item) return;
  item.status = status;
  item.updatedAt = Date.now();
  await save();
  render();
  showToast('Status atualizado');
}

function render(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const statusF = document.getElementById('statusFilter').value;
  const prioF = document.getElementById('prioridadeFilter').value;
  const respF = document.getElementById('responsavelFilter').value.trim().toLowerCase();

  const filtered = items.filter(i => {
    if(statusF && i.status !== statusF) return false;
    if(prioF && i.prioridade !== prioF) return false;
    if(respF && !(i.responsavel || '').toLowerCase().includes(respF)) return false;
    if(q && !(i.titulo.toLowerCase().includes(q) || (i.descricao||'').toLowerCase().includes(q))) return false;
    return true;
  });

  document.getElementById('kpiPendentes').textContent = items.filter(i => i.status === 'Pendente').length;
  document.getElementById('kpiAndamento').textContent = items.filter(i => i.status === 'Em andamento').length;
  document.getElementById('kpiUrgentes').textContent = items.filter(i => i.prioridade === 'Urgente' && i.status !== 'Concluído' && i.status !== 'Cancelado').length;
  document.getElementById('kpiTotal').textContent = items.length;

  document.getElementById('emptyState').style.display = filtered.length === 0 ? 'block' : 'none';
  document.getElementById('listBody').innerHTML = filtered.map(i => {
    const isFinal = i.status === 'Concluído' || i.status === 'Cancelado';
    return `<tr>
      <td>${escapeHtml(i.titulo)}</td>
      <td>${escapeHtml(i.responsavel) || '—'}</td>
      <td>${escapeHtml(i.criadoPor) || '—'}</td>
      <td>${fmtDateBR(i.dataCriacao)}</td>
      <td>${fmtDateBR(i.prazo)}</td>
      <td><span class="tag ${prioridadeTagClass(i.prioridade)}">${i.prioridade}</span></td>
      <td><span class="tag ${statusTagClass(i.status)}">${i.status}</span></td>
      <td class="action-cell">
        <button class="btn btn-outline" data-edit="${i.id}">Editar</button>
        ${!isFinal && i.status !== 'Em andamento' ? `<button class="btn btn-ghost" data-status="${i.id}" data-to="Em andamento">Iniciar</button>` : ''}
        ${!isFinal ? `<button class="btn btn-ghost" data-status="${i.id}" data-to="Concluído">Concluir</button>` : ''}
        ${!isFinal ? `<button class="btn btn-ghost" data-status="${i.id}" data-to="Cancelado">Cancelar</button>` : ''}
      </td>
    </tr>`;
  }).join('');
}

document.getElementById('listBody').addEventListener('click', (e) => {
  const editBtn = e.target.closest('[data-edit]');
  if(editBtn){ openForm(items.find(i => i.id === editBtn.dataset.edit)); return; }
  const statusBtn = e.target.closest('[data-status]');
  if(statusBtn){ setStatus(statusBtn.dataset.status, statusBtn.dataset.to); }
});

['searchInput','statusFilter','prioridadeFilter','responsavelFilter'].forEach(id => {
  document.getElementById(id).addEventListener('input', render);
});

async function init(){
  await ensureAuth();
  const names = await loadEquipeNames();
  document.getElementById('equipeNames').innerHTML = names.map(n => `<option value="${escapeHtml(n)}">`).join('');
  await load();
  render();
}
init();
</script>
</body>
</html>
