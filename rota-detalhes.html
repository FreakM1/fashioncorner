<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalhes da Rota</title>
<link rel="stylesheet" href="assets/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-config.js"></script>
<script>guardDashboardAuth();</script>
<style>
  .status-btns{display:flex;gap:6px;}
  .status-btn{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.03em;padding:4px 10px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;white-space:nowrap;}
  .status-btn.active[data-status="entregue"]{border-color:var(--sage);background:#E9F1EA;color:var(--sage);}
  .status-btn.active[data-status="nao_entregue"]{border-color:var(--danger);background:#FBEAE8;color:var(--danger);}
</style>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="page">

      <div id="notFound" class="card empty-state" style="display:none;">Rota não encontrada.</div>

      <div id="content" style="display:none;">
        <div class="kpi-grid">
          <div class="kpi-card"><div class="kpi-label">Km</div><div class="kpi-value" id="dKm"></div></div>
          <div class="kpi-card"><div class="kpi-label">Paradas</div><div class="kpi-value" id="dParadas"></div></div>
          <div class="kpi-card"><div class="kpi-label">Entregas</div><div class="kpi-value" id="dEntregas"></div></div>
          <div class="kpi-card"><div class="kpi-label">Não entregues</div><div class="kpi-value" id="dNaoEntregues"></div></div>
        </div>

        <div class="card">
          <div class="card-title">Resumo</div>
          <p class="note" id="summaryLine"></p>
        </div>

        <div class="card">
          <div class="card-title">Paradas</div>
          <div style="overflow-x:auto;">
            <table class="data-table">
              <thead><tr><th>#</th><th>Cliente</th><th>Tipo</th><th>Horário previsto</th><th>Status</th></tr></thead>
              <tbody id="stopsBody"></tbody>
            </table>
          </div>
        </div>

        <div class="card">
          <div class="card-title">Observações da rota</div>
          <textarea id="obsInput" placeholder="Ex: cliente X não atendeu, tentamos contato por WhatsApp." style="min-height:70px;"></textarea>
          <button class="btn btn-dark" id="saveObsBtn" style="margin-top:10px;">Salvar observações</button>
        </div>
      </div>

    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/shared.js"></script>
<script src="assets/shell.js"></script>
<script>
renderShell({ active: 'historico', title: 'Detalhes da Rota', subtitle: 'Conferência da rota realizada' });

const toast = document.getElementById('toast');
function showToast(msg){ toast.textContent = msg; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'), 2200); }

let route = null;

// horário previsto de chegada em cada parada — cada rota já carrega sua
// própria config (saída/tempo padrão/prova, definida na Rota do Dia).
// Rotas antigas (de antes das rotas múltiplas) não têm route.config; pra
// essas, cai de volta pra config-<data da rota>, que era onde ficava salva.
async function computeStopEtas(route){
  const cfg = route.config || await loadDoc('config-' + route.date, null);
  return computeEtasFromLegs(route.orders || [], route.legs, cfg);
}

async function init(){
  await ensureAuth();
  const id = new URLSearchParams(location.search).get('id');
  route = id ? await loadDoc(id, null) : null;
  if(!route){
    document.getElementById('notFound').style.display = 'block';
    return;
  }
  document.getElementById('content').style.display = 'block';
  document.title = `Rota ${route.seq} — ${route.date}`;

  const s = summarizeRoute(route);
  document.getElementById('dKm').textContent = s.km.toFixed(1).replace('.',',') + ' km';
  document.getElementById('dParadas').textContent = s.paradas;
  document.getElementById('dEntregas').textContent = s.entregas;
  document.getElementById('dNaoEntregues').textContent = s.naoEntregues;

  const statusLabel = route.status === 'finalizada' ? 'Concluída' : 'Em andamento';
  document.getElementById('summaryLine').innerHTML =
    `Data: <strong>${route.date.split('-').reverse().join('/')}</strong> · Rota ${route.seq} · Status: <strong>${statusLabel}</strong>` +
    (route.finalizedAt ? ` · Concluída às ${new Date(route.finalizedAt).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}` : '') +
    `<br>Trocas: ${s.trocas} · Provas: ${s.provas} · Retiradas: ${s.retiradas} · Com horário definido: ${s.comHorario}`;

  const orders = route.orders || [];
  const etas = await computeStopEtas(route);
  document.getElementById('stopsBody').innerHTML = orders.map((o, i) => {
    const isEdge = i === 0 || i === orders.length - 1;
    const tipo = o.kind === 'avulsa' ? 'Parada avulsa' : (o.modes||[]).join(' + ');
    const horario = (etas && !isEdge) ? fmtTime(etas[i]) : '—';
    const statusHtml = isEdge ? '—' : `<div class="status-btns" data-idx="${i}">
      <button type="button" class="status-btn${o.status==='entregue'?' active':''}" data-status="entregue">Concluído</button>
      <button type="button" class="status-btn${o.status==='nao_entregue'?' active':''}" data-status="nao_entregue">Não entregue</button>
    </div>`;
    return `<tr>
      <td>${i+1}</td><td>${escapeHtml(o.name)}</td><td>${escapeHtml(tipo)}</td>
      <td>${horario}</td><td>${statusHtml}</td>
    </tr>`;
  }).join('');

  document.getElementById('obsInput').value = route.observacoes || '';
}

document.getElementById('stopsBody').addEventListener('click', async (e) => {
  const btn = e.target.closest('.status-btn');
  if(!btn) return;
  const idx = parseInt(btn.closest('.status-btns').dataset.idx);
  const clickedStatus = btn.dataset.status;
  const order = route.orders[idx];
  order.status = (order.status === clickedStatus) ? 'pendente' : clickedStatus;
  btn.parentElement.querySelectorAll('.status-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.status === order.status);
  });
  await saveDoc(route.id, route);
  showToast('Status atualizado');
});

document.getElementById('saveObsBtn').addEventListener('click', async () => {
  route.observacoes = document.getElementById('obsInput').value.trim();
  await saveDoc(route.id, route);
  showToast('Observações salvas');
});

init();
</script>
</body>
</html>
