<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedido Rápido</title>
<link rel="stylesheet" href="assets/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="assets/supabase-config.js"></script>
<script>guardDashboardAuth();</script>
<style>
  .grid2{display:grid;grid-template-columns:1.3fr 0.9fr;gap:18px;align-items:start;}
  @media (max-width:980px){.grid2{grid-template-columns:1fr;}}
  .search-box{position:relative;}
  .results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(42,36,32,.12);max-height:280px;overflow-y:auto;z-index:20;display:none;}
  .results.open{display:block;}
  .result-item{padding:10px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:10px;}
  .result-item:last-child{border-bottom:none;}
  .result-item:hover{background:var(--paper-2);}
  .result-item .rname{font-weight:500;}
  .result-item .rcity{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);white-space:nowrap;}
  .result-empty{padding:14px;color:var(--muted);font-size:13px;}
  .selected-client{margin-top:16px;display:none;}
  .selected-client.show{display:block;}
  .client-name-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .client-name-row h2{font-family:'Fraunces',serif;font-size:19px;margin:0;}
  .city-pill{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);border:1px solid var(--line);padding:3px 9px;border-radius:20px;}
  .addr-list{display:flex;flex-direction:column;gap:8px;}
  .addr-card{border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;transition:border-color .15s,background .15s;}
  .addr-card:hover{border-color:var(--gold);}
  .addr-card.selected{border-color:var(--wine);background:#FBF0F2;}
  .addr-top{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
  .type-badge{font-family:'IBM Plex Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:20px;background:var(--paper-2);color:var(--ink);}
  .principal-star{color:var(--gold);font-size:13px;}
  .addr-text{font-size:14px;line-height:1.4;}
  .addr-extra{font-size:12.5px;color:var(--muted);margin-top:3px;}
  .subform{border:1.5px dashed var(--line);border-radius:12px;padding:16px;margin-top:14px;display:none;background:var(--paper);}
  .subform.open{display:block;}
  .subform-title{font-family:'Fraunces',serif;font-size:15px;margin:0 0 4px;}
  .addr-block{border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:10px;background:#fff;}
  .addr-block-head{display:flex;justify-content:space-between;align-items:center;}
  .addr-block-head span{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--muted);text-transform:uppercase;}
  .check-row{display:flex;align-items:center;gap:7px;margin-top:10px;font-size:13px;}
  .form-actions{display:flex;gap:8px;margin-top:14px;}
  .small-x{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:0 4px;}
  .small-x:hover{color:var(--wine);}
  .last-added{border-bottom:1px solid var(--line);padding:10px 0;}
  .last-added:last-child{border-bottom:none;}
  .last-added .la-name{font-weight:600;font-size:13.5px;}
  .last-added .la-meta{font-size:12px;color:var(--muted);margin-top:2px;}
</style>
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="page">
      <div class="grid2">
        <div class="card">
          <div class="card-title">Buscar cliente</div>
          <div style="display:flex;justify-content:flex-end;margin:-38px 0 10px;">
            <button class="btn btn-outline" id="toggleNewClient" style="padding:6px 12px;font-size:12px;">+ Nova cliente</button>
          </div>
          <div class="search-box">
            <input type="text" id="searchInput" placeholder="Digite o nome da cliente..." autocomplete="off">
            <div class="results" id="results"></div>
          </div>

          <div class="subform" id="newClientForm">
            <div class="subform-title">Cadastrar nova cliente</div>
            <label class="f-label">Nome</label>
            <input type="text" id="ncName" placeholder="Nome completo">
            <div class="two-col">
              <div>
                <label class="f-label">Cidade</label>
                <input type="text" id="ncCity" placeholder="Ex: Campinas">
              </div>
              <div>
                <label class="f-label">Telefone (opcional)</label>
                <input type="tel" id="ncPhone" placeholder="19999999999">
              </div>
            </div>
            <label class="f-label">Endereço</label>
            <select id="ncType">
              <option>Casa</option><option>Trabalho</option><option>Outro</option>
            </select>
            <input type="text" id="ncAddress" placeholder="Rua, número - bairro, cidade - UF, CEP" style="margin-top:8px;">
            <div class="two-col" style="margin-top:8px;">
              <input type="text" id="ncComplement" placeholder="Complemento (bloco, apto...)">
              <input type="text" id="ncObs" placeholder="Referência / observação">
            </div>
            <div class="form-actions">
              <button class="btn btn-dark" id="ncSave">Salvar cliente</button>
              <button class="btn btn-outline" id="ncCancel">Cancelar</button>
            </div>
          </div>

          <div class="selected-client" id="selectedClient">
            <div class="client-name-row">
              <h2 id="scName"></h2>
              <div style="display:flex;align-items:center;gap:8px;">
                <div class="city-pill" id="scCity"></div>
                <button class="btn btn-outline" id="toggleEditClient" style="padding:6px 12px;font-size:12px;">Editar cadastro</button>
              </div>
            </div>

            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
              <div class="card-title" style="margin:0;flex:1;">Endereço</div>
              <button class="btn btn-outline" id="toggleNewAddr" style="padding:6px 12px;font-size:12px;">+ Novo endereço</button>
            </div>
            <div class="addr-list" id="addrList"></div>

            <div class="subform" id="newAddrForm">
              <div class="subform-title">Novo endereço para esta cliente</div>
              <div class="two-col">
                <select id="naType"><option>Casa</option><option>Trabalho</option><option>Outro</option></select>
                <label class="check-row" style="margin:0;"><input type="checkbox" id="naPrincipal"> Marcar como principal</label>
              </div>
              <input type="text" id="naAddress" placeholder="Rua, número - bairro, cidade - UF, CEP" style="margin-top:8px;">
              <div class="two-col" style="margin-top:8px;">
                <input type="text" id="naComplement" placeholder="Complemento">
                <input type="text" id="naObs" placeholder="Referência / observação">
              </div>
              <div class="form-actions">
                <button class="btn btn-dark" id="naSave">Salvar endereço</button>
                <button class="btn btn-outline" id="naCancel">Cancelar</button>
              </div>
            </div>

            <div class="subform" id="editClientForm">
              <div class="subform-title">Editar cadastro da cliente</div>
              <label class="f-label">Nome</label>
              <input type="text" id="ecName">
              <div class="two-col">
                <div><label class="f-label">Cidade</label><input type="text" id="ecCity"></div>
                <div><label class="f-label">Telefone</label><input type="tel" id="ecPhone"></div>
              </div>
              <label class="f-label">Endereços</label>
              <div id="ecAddrBlocks"></div>
              <button class="btn btn-outline" id="ecAddAddr" style="margin-top:10px;padding:6px 12px;font-size:12px;">+ Adicionar outro endereço</button>
              <div class="form-actions">
                <button class="btn btn-dark" id="ecSave">Salvar alterações</button>
                <button class="btn btn-outline" id="ecCancel">Cancelar</button>
              </div>
            </div>

            <div class="card-title" style="margin-top:20px;">Tipo de atendimento</div>
            <div class="pill-group" id="modalPills">
              <button class="pill-toggle" data-mode="ENTREGA">Entrega</button>
              <button class="pill-toggle" data-mode="RETIRAR MALA">Retirar mala</button>
              <button class="pill-toggle" data-mode="RETIRADA">Retirada</button>
              <button class="pill-toggle" data-mode="DEIXAR MALA">Deixar mala</button>
              <button class="pill-toggle" data-mode="PROVA NA HORA">Prova na hora</button>
              <button class="pill-toggle" data-mode="TROCA">Troca</button>
              <button class="pill-toggle" data-mode="PIPOCA">Pipoca</button>
              <button class="pill-toggle" data-mode="CORREIO">Correio</button>
            </div>
            <div id="correioQty" style="display:none;margin-top:8px;">
              <label class="f-label">Quantos pacotes?</label>
              <input type="number" id="correioQtyInput" min="1" placeholder="Ex: 4" style="max-width:120px;">
            </div>

            <div class="card-title" style="margin-top:20px;">Horário da entrega</div>
            <div class="pill-group" id="twPills">
              <button type="button" class="tw-pill active" data-tw="none">Sem horário</button>
              <button type="button" class="tw-pill" data-tw="before">Antes de</button>
              <button type="button" class="tw-pill" data-tw="after">Depois de</button>
            </div>
            <div id="twTimeBox" style="display:none;margin-top:8px;">
              <input type="time" id="twTimeInput" style="max-width:140px;">
            </div>

            <label class="f-label">Observação do pedido (opcional)</label>
            <textarea id="obsInput" placeholder="Ex: 3 peças, ligar antes de subir..." style="min-height:60px;"></textarea>

            <button class="btn btn-dark" id="addBtn" disabled style="width:100%;margin-top:16px;">Adicionar à rota de hoje</button>
          </div>
        </div>

        <div>
          <div class="card">
            <div class="card-title">Parada avulsa (algo pontual, sem cadastro)</div>
            <label class="f-label">Nome da parada</label>
            <input type="text" id="avName" placeholder="Ex: Correios - Agência Cambuí">
            <label class="f-label">Endereço</label>
            <input type="text" id="avAddress" placeholder="Endereço completo">
            <label class="f-label">Observação (opcional)</label>
            <input type="text" id="avObs" placeholder="Ex: deixar 3 pacotes">

            <div class="card-title" style="margin-top:20px;">Horário da entrega</div>
            <div class="pill-group" id="avTwPills">
              <button type="button" class="tw-pill active" data-tw="none">Sem horário</button>
              <button type="button" class="tw-pill" data-tw="before">Antes de</button>
              <button type="button" class="tw-pill" data-tw="after">Depois de</button>
            </div>
            <div id="avTwTimeBox" style="display:none;margin-top:8px;">
              <input type="time" id="avTwTimeInput" style="max-width:140px;">
            </div>

            <button class="btn btn-outline" id="avAdd" style="width:100%;margin-top:16px;">Adicionar parada à rota</button>
          </div>

          <div class="card">
            <div class="card-title">Paradas adicionadas hoje</div>
            <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px;">
              <div style="font-family:'Fraunces',serif;font-size:26px;" id="todayCount">0</div>
              <a href="rota-do-dia.html" class="btn btn-outline" style="padding:8px 14px;font-size:12.5px;">Ver rota do dia →</a>
            </div>
            <div id="lastAddedList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="assets/shared.js"></script>
<script src="assets/shell.js"></script>
<script>
renderShell({ active: 'pedido', title: 'Pedido Rápido', subtitle: 'Adicione clientes e paradas na rota de hoje' });

let CLIENTS = [];
let orders = [];
let selected = null;
let selectedModes = new Set();
let selectedTW = { type:'none', time:null };
let avTW = { type:'none', time:null };

const toast = document.getElementById('toast');
function showToast(msg){ toast.textContent = msg; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'), 2200); }
function norm(s){ return (s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

async function loadClients(){
  CLIENTS = await loadDoc('clients-db', DEFAULT_CLIENTS);
}
async function saveClients(){
  await saveDoc('clients-db', CLIENTS);
}
async function loadOrders(){ orders = await loadDoc(todayKey(), []); }
async function saveOrders(){ await saveDoc(todayKey(), orders); }

async function init(){
  await ensureAuth();
  await loadClients();
  await loadOrders();
  renderLastAdded();
}
init();

const searchInput = document.getElementById('searchInput');
const resultsEl = document.getElementById('results');
const selectedClientEl = document.getElementById('selectedClient');
const scName = document.getElementById('scName');
const scCity = document.getElementById('scCity');
const addrList = document.getElementById('addrList');
const addBtn = document.getElementById('addBtn');
const obsInput = document.getElementById('obsInput');

// ---------- BUSCA ----------
searchInput.addEventListener('input', () => {
  const q = norm(searchInput.value.trim());
  if(!q){ resultsEl.classList.remove('open'); return; }
  const matches = CLIENTS.filter(c => norm(c.n).includes(q)).slice(0, 8);
  resultsEl.innerHTML = matches.length === 0
    ? '<div class="result-empty">Nenhuma cliente encontrada. Use "+ Nova cliente" pra cadastrar.</div>'
    : matches.map(c => `<div class="result-item" data-idx="${CLIENTS.indexOf(c)}"><span class="rname">${escapeHtml(c.n)}</span><span class="rcity">${escapeHtml(c.c) || '—'}</span></div>`).join('');
  resultsEl.classList.add('open');
});
resultsEl.addEventListener('click', (e) => {
  const item = e.target.closest('.result-item');
  if(!item || !item.dataset.idx) return;
  selectClient(CLIENTS[parseInt(item.dataset.idx)]);
});
document.addEventListener('click', (e) => { if(!e.target.closest('.search-box')) resultsEl.classList.remove('open'); });

function selectClient(client){
  selected = { client, addrIndex: null };
  selectedModes = new Set();
  searchInput.value = client.n;
  resultsEl.classList.remove('open');
  scName.textContent = client.n;
  scCity.textContent = client.c || '—';
  selectedClientEl.classList.add('show');
  renderAddrList();
  const principalIdx = client.a.findIndex(a => a.p);
  if(client.a.length === 1) chooseAddress(0);
  else if(principalIdx >= 0) chooseAddress(principalIdx);
  document.querySelectorAll('.pill-toggle').forEach(b => b.classList.remove('active'));
  obsInput.value = '';
  selectedTW = { type:'none', time:null };
  resetTimeWindowPicker('twPills', 'twTimeBox', 'twTimeInput');
  document.getElementById('newAddrForm').classList.remove('open');
  document.getElementById('editClientForm').classList.remove('open');
  updateAddBtn();
}

function renderAddrList(){
  addrList.innerHTML = selected.client.a.map((addr, i) => `
    <div class="addr-card ${selected.addrIndex===i ? 'selected':''}" data-idx="${i}">
      <div class="addr-top"><span class="type-badge">${escapeHtml(addr.t) || 'Endereço'}</span>${addr.p ? '<span class="principal-star">★ principal</span>' : ''}</div>
      <div class="addr-text">${escapeHtml(addr.e)}</div>
      ${addr.x ? `<div class="addr-extra">${escapeHtml(addr.x)}</div>` : ''}
      ${addr.o ? `<div class="addr-extra">Obs: ${escapeHtml(addr.o)}</div>` : ''}
    </div>`).join('');
}
addrList.addEventListener('click', (e) => {
  const card = e.target.closest('.addr-card');
  if(!card) return;
  chooseAddress(parseInt(card.dataset.idx));
});
function chooseAddress(idx){
  selected.addrIndex = idx;
  document.querySelectorAll('.addr-card').forEach(c => c.classList.toggle('selected', parseInt(c.dataset.idx)===idx));
  updateAddBtn();
}

document.querySelectorAll('.pill-toggle').forEach(btn => {
  btn.addEventListener('click', () => {
    const mode = btn.dataset.mode;
    if(selectedModes.has(mode)){ selectedModes.delete(mode); btn.classList.remove('active'); }
    else { selectedModes.add(mode); btn.classList.add('active'); }
    if(mode === 'CORREIO'){
      document.getElementById('correioQty').style.display = selectedModes.has('CORREIO') ? 'block' : 'none';
    }
    updateAddBtn();
  });
});

function updateAddBtn(){ addBtn.disabled = !(selected && selected.addrIndex !== null && selectedModes.size > 0); }

// ---------- HORÁRIO DA ENTREGA (Sem horário / Antes de / Depois de) ----------
function setupTimeWindowPicker(pillGroupId, timeBoxId, timeInputId, onChange){
  const group = document.getElementById(pillGroupId);
  const box = document.getElementById(timeBoxId);
  const input = document.getElementById(timeInputId);
  group.querySelectorAll('.tw-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      group.querySelectorAll('.tw-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const type = btn.dataset.tw;
      box.style.display = (type === 'none') ? 'none' : 'block';
      onChange({ type, time: type === 'none' ? null : (input.value || null) });
    });
  });
  input.addEventListener('input', () => {
    const active = group.querySelector('.tw-pill.active');
    const type = active ? active.dataset.tw : 'none';
    onChange({ type, time: input.value || null });
  });
}
function resetTimeWindowPicker(pillGroupId, timeBoxId, timeInputId){
  document.getElementById(pillGroupId).querySelectorAll('.tw-pill').forEach(b => b.classList.toggle('active', b.dataset.tw === 'none'));
  document.getElementById(timeBoxId).style.display = 'none';
  document.getElementById(timeInputId).value = '';
}
setupTimeWindowPicker('twPills', 'twTimeBox', 'twTimeInput', (tw) => { selectedTW = tw; });
setupTimeWindowPicker('avTwPills', 'avTwTimeBox', 'avTwTimeInput', (tw) => { avTW = tw; });

addBtn.addEventListener('click', async () => {
  const addr = selected.client.a[selected.addrIndex];
  const modesFinal = Array.from(selectedModes).map(m => {
    if(m === 'CORREIO'){
      const qty = document.getElementById('correioQtyInput').value.trim();
      return qty ? `CORREIO - ${qty} PACOTES` : 'CORREIO';
    }
    return m;
  });
  await loadOrders();
  orders.push({
    kind: 'cliente', name: selected.client.n, phone: selected.client.f, city: selected.client.c,
    address: addr.e, complement: addr.x, ref: addr.o,
    modes: modesFinal, obs: obsInput.value.trim(), timeWindow: selectedTW, status: 'pendente'
  });
  await saveOrders();
  renderLastAdded();
  showToast('Adicionado à rota de hoje');
  selected = null; selectedModes = new Set();
  selectedTW = { type:'none', time:null };
  resetTimeWindowPicker('twPills', 'twTimeBox', 'twTimeInput');
  searchInput.value = '';
  selectedClientEl.classList.remove('show');
  document.getElementById('correioQty').style.display = 'none';
  document.getElementById('correioQtyInput').value = '';
  searchInput.focus();
});

// ---------- NOVA CLIENTE ----------
const newClientForm = document.getElementById('newClientForm');
document.getElementById('toggleNewClient').addEventListener('click', () => {
  newClientForm.classList.toggle('open');
  selectedClientEl.classList.remove('show');
});
document.getElementById('ncCancel').addEventListener('click', () => newClientForm.classList.remove('open'));
document.getElementById('ncSave').addEventListener('click', () => {
  const name = document.getElementById('ncName').value.trim();
  const address = document.getElementById('ncAddress').value.trim();
  if(!name || !address){ showToast('Preencha ao menos nome e endereço'); return; }
  const newClient = {
    n: name.toUpperCase(),
    f: document.getElementById('ncPhone').value.trim(),
    c: document.getElementById('ncCity').value.trim(),
    a: [{ t: document.getElementById('ncType').value, e: address, x: document.getElementById('ncComplement').value.trim(), o: document.getElementById('ncObs').value.trim(), p: true }]
  };
  CLIENTS.unshift(newClient);
  saveClients();
  ['ncName','ncCity','ncPhone','ncAddress','ncComplement','ncObs'].forEach(id => document.getElementById(id).value = '');
  newClientForm.classList.remove('open');
  showToast('Cliente cadastrada!');
  selectClient(newClient);
});

// ---------- NOVO ENDEREÇO ----------
const newAddrForm = document.getElementById('newAddrForm');
document.getElementById('toggleNewAddr').addEventListener('click', () => newAddrForm.classList.toggle('open'));
document.getElementById('naCancel').addEventListener('click', () => newAddrForm.classList.remove('open'));
document.getElementById('naSave').addEventListener('click', () => {
  const address = document.getElementById('naAddress').value.trim();
  if(!address){ showToast('Preencha o endereço'); return; }
  const isPrincipal = document.getElementById('naPrincipal').checked;
  if(isPrincipal) selected.client.a.forEach(a => a.p = false);
  selected.client.a.push({
    t: document.getElementById('naType').value, e: address,
    x: document.getElementById('naComplement').value.trim(), o: document.getElementById('naObs').value.trim(),
    p: isPrincipal
  });
  ['naAddress','naComplement','naObs'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('naPrincipal').checked = false;
  newAddrForm.classList.remove('open');
  renderAddrList();
  chooseAddress(selected.client.a.length - 1);
  saveClients();
  showToast('Endereço adicionado');
});

// ---------- EDITAR CADASTRO ----------
let ecBlockCounter = 0;
function createEcBlock(addr){
  const id = 'ec' + (ecBlockCounter++);
  const div = document.createElement('div');
  div.className = 'addr-block';
  div.dataset.blockId = id;
  div.innerHTML = `
    <div class="addr-block-head"><span>Endereço</span><button type="button" class="small-x" data-remove="${id}">✕</button></div>
    <div class="two-col" style="margin-top:8px;">
      <select class="ec-type">
        <option ${addr.t==='Casa'?'selected':''}>Casa</option>
        <option ${addr.t==='Trabalho'?'selected':''}>Trabalho</option>
        <option ${addr.t==='Outro'?'selected':''}>Outro</option>
      </select>
      <label class="check-row" style="margin:0;"><input type="radio" name="ecPrincipal" class="ec-principal" value="${id}" ${addr.p?'checked':''}> Principal</label>
    </div>
    <input type="text" class="ec-address" value="${escapeHtml(addr.e)}" placeholder="Endereço completo" style="margin-top:8px;">
    <div class="two-col" style="margin-top:8px;">
      <input type="text" class="ec-complement" value="${escapeHtml(addr.x)}" placeholder="Complemento">
      <input type="text" class="ec-obs" value="${escapeHtml(addr.o)}" placeholder="Referência/obs">
    </div>`;
  return div;
}
function openEditClient(){
  document.getElementById('ecName').value = selected.client.n;
  document.getElementById('ecCity').value = selected.client.c;
  document.getElementById('ecPhone').value = selected.client.f;
  const container = document.getElementById('ecAddrBlocks');
  container.innerHTML = '';
  ecBlockCounter = 0;
  selected.client.a.forEach(addr => container.appendChild(createEcBlock(addr)));
  document.getElementById('editClientForm').classList.add('open');
  newAddrForm.classList.remove('open');
}
document.getElementById('toggleEditClient').addEventListener('click', () => {
  const f = document.getElementById('editClientForm');
  if(f.classList.contains('open')) f.classList.remove('open');
  else openEditClient();
});
document.getElementById('ecCancel').addEventListener('click', () => document.getElementById('editClientForm').classList.remove('open'));
document.getElementById('ecAddAddr').addEventListener('click', () => {
  document.getElementById('ecAddrBlocks').appendChild(createEcBlock({t:'Casa',e:'',x:'',o:'',p:false}));
});
document.getElementById('ecAddrBlocks').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-remove]');
  if(!btn) return;
  const blocks = document.querySelectorAll('#ecAddrBlocks .addr-block');
  if(blocks.length <= 1){ showToast('A cliente precisa ter ao menos 1 endereço'); return; }
  btn.closest('.addr-block').remove();
});
document.getElementById('ecSave').addEventListener('click', () => {
  const name = document.getElementById('ecName').value.trim();
  if(!name){ showToast('Nome não pode ficar vazio'); return; }
  const blocks = document.querySelectorAll('#ecAddrBlocks .addr-block');
  const newAddrs = [];
  blocks.forEach(b => {
    const address = b.querySelector('.ec-address').value.trim();
    if(!address) return;
    newAddrs.push({
      t: b.querySelector('.ec-type').value,
      e: address,
      x: b.querySelector('.ec-complement').value.trim(),
      o: b.querySelector('.ec-obs').value.trim(),
      p: b.querySelector('.ec-principal').checked
    });
  });
  if(newAddrs.length === 0){ showToast('Precisa ter ao menos 1 endereço válido'); return; }
  if(!newAddrs.some(a => a.p)) newAddrs[0].p = true;
  selected.client.n = name.toUpperCase();
  selected.client.c = document.getElementById('ecCity').value.trim();
  selected.client.f = document.getElementById('ecPhone').value.trim();
  selected.client.a = newAddrs;
  scName.textContent = selected.client.n;
  scCity.textContent = selected.client.c || '—';
  selected.addrIndex = null;
  renderAddrList();
  updateAddBtn();
  document.getElementById('editClientForm').classList.remove('open');
  saveClients();
  showToast('Cadastro atualizado');
});

// ---------- PARADA AVULSA ----------
document.getElementById('avAdd').addEventListener('click', async () => {
  const name = document.getElementById('avName').value.trim();
  const address = document.getElementById('avAddress').value.trim();
  if(!name || !address){ showToast('Preencha nome e endereço da parada'); return; }
  await loadOrders();
  orders.push({ kind:'avulsa', name, address, obs: document.getElementById('avObs').value.trim(), timeWindow: avTW, status: 'pendente' });
  await saveOrders();
  ['avName','avAddress','avObs'].forEach(id => document.getElementById(id).value = '');
  avTW = { type:'none', time:null };
  resetTimeWindowPicker('avTwPills', 'avTwTimeBox', 'avTwTimeInput');
  renderLastAdded();
  showToast('Parada adicionada');
});

// ---------- RESUMO "ADICIONADAS HOJE" ----------
function renderLastAdded(){
  document.getElementById('todayCount').textContent = orders.length;
  const last = orders.slice(-5).reverse();
  document.getElementById('lastAddedList').innerHTML = last.length === 0
    ? '<p class="note">Nenhuma parada adicionada ainda hoje.</p>'
    : last.map(o => `
      <div class="last-added">
        <div class="la-name">${escapeHtml(o.name)}</div>
        <div class="la-meta">${o.kind === 'avulsa' ? 'Parada avulsa' : escapeHtml((o.modes||[]).join(' + '))}${timeWindowLabel(o.timeWindow) ? ' · ' + escapeHtml(timeWindowLabel(o.timeWindow)) : ''}</div>
      </div>`).join('');
}
</script>
</body>
</html>
