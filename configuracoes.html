<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configurações</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="app-shell">
  <nav class="sidebar" id="sidebar"></nav>
  <div class="main">
    <header class="topbar" id="topbar"></header>
    <div class="page">

      <div class="card">
        <div class="card-title">Endereço padrão da loja</div>
        <p class="note" style="margin:0 0 8px;">Usado como sugestão de saída/retorno ao montar uma rota nova.</p>
        <label class="f-label">Endereço</label>
        <input type="text" id="lojaAddress" placeholder="Rua, número - bairro, cidade - UF, CEP">
      </div>

      <div class="card">
        <div class="card-title">Parâmetros do motoboy</div>
        <p class="note" style="margin:0 0 8px;">Reservado pra configurações futuras (valor por km, veículo, turno etc.).</p>
        <label class="f-label">Nome</label>
        <input type="text" id="motoboyNome" placeholder="Opcional, por enquanto">
      </div>

      <button class="btn btn-primary" id="saveBtn">Salvar configurações</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/shared.js"></script>
<script src="assets/shell.js"></script>
<script>
renderShell({ active: 'config', title: 'Configurações', subtitle: 'Preferências gerais do painel' });

const toast = document.getElementById('toast');
function showToast(msg){ toast.textContent = msg; toast.classList.add('show'); setTimeout(()=>toast.classList.remove('show'), 2200); }

const SETTINGS_KEY = 'settings';

async function init(){
  await ensureAuth();
  const settings = await loadDoc(SETTINGS_KEY, { lojaAddress: '', motoboyNome: '' });
  document.getElementById('lojaAddress').value = settings.lojaAddress || '';
  document.getElementById('motoboyNome').value = settings.motoboyNome || '';
}

document.getElementById('saveBtn').addEventListener('click', async () => {
  await saveDoc(SETTINGS_KEY, {
    lojaAddress: document.getElementById('lojaAddress').value.trim(),
    motoboyNome: document.getElementById('motoboyNome').value.trim()
  });
  showToast('Configurações salvas');
});

init();
</script>
</body>
</html>
